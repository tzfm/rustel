name: Debug flake

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"

jobs:
  rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: bash .github/scripts/apt-install.sh pkg-config libasound2-dev libudev-dev libdbus-1-dev mesa-vulkan-drivers
      - name: Restore the studio sample cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/rustel-studio-sample-cache
          key: rustel-studio-samples-v1-${{ hashFiles('crates/runtime/assets/sample-banks.json', 'crates/runtime/assets/gm-fonts.json') }}
          restore-keys: rustel-studio-samples-v1-
      - run: cargo test -p rustel-studio-e2e --features pty --test settings_rows --no-run
      - name: Run the rows suite a few times
        env:
          RUSTEL_SAMPLE_CACHE: ${{ runner.temp }}/rustel-studio-sample-cache
        run: |
          mkdir -p "$RUSTEL_SAMPLE_CACHE"
          for i in 1 2 3 4 5 6; do
            cargo test -q -p rustel-studio-e2e --features pty --test settings_rows -- --test-threads=1 --nocapture > "run$i.log" 2>&1 || true
            echo "=== run $i: $(grep -a 'test result' run$i.log)"
            if grep -aq "FAILED" "run$i.log"; then
              awk '/^test a_source_turned_off/{on=1} on && /^test / && !/a_source_turned_off/{on=0} on' "run$i.log" | grep -a "DBG\|panicked\|within\|test " | uniq -c | tail -150 | cut -c1-700
            fi
          done
