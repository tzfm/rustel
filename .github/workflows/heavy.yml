name: Heavy CI

# Release-mode corpus and Studio end-to-end checks. They run on every PR that
# is not a draft, on main pushes and twice weekly to warm the caches. A PR run
# tests the merge commit. `Heavy result` is a required check, so a PR merges
# only after these checks pass.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1,4'

permissions:
  contents: read

jobs:
  main:
    name: Main heavy checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    cache-mode: write
    uses: ./.github/workflows/heavy-checks.yml
    with:
      save_cache: true

  pull-request:
    name: PR heavy checks
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    cache-mode: read
    uses: ./.github/workflows/heavy-checks.yml
    with:
      save_cache: false

  # The one check the main ruleset requires. A draft fails it, so a PR cannot
  # merge on a skipped run. Marking the PR ready starts a new run.
  result:
    name: Heavy result
    needs: [main, pull-request]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless the heavy checks passed
        env:
          DRAFT: ${{ github.event.pull_request.draft == true }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if [ "$DRAFT" = true ]; then
            echo '::error::Draft PR. Heavy CI runs when the PR is ready for review.'
            exit 1
          fi
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
            *" success "*) ;;
            *) exit 1 ;;
          esac
