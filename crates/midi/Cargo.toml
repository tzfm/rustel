[package]
name = "rustel-midi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "MIDI output: timed note, CC and transport messages to a hardware or virtual port"

[features]
# The platform MIDI stack: port listing and opening through `midir`. The
# message planner, encoder and sender build without it, so a host that only
# needs the wire format can leave the device stack out.
default = ["device"]
device = ["dep:midir"]

[dependencies]
rustel-core = { path = "../core" }
midir = { version = "0.11", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `access(2)` on the ALSA sequencer device before `midir` opens it.
libc = "0.2"

[dev-dependencies]
