[package]
name = "rustel-vst3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "VST3 plugin host: finds, loads and runs plugins as orbit inserts"

[dependencies]
rustel-audio = { path = "../audio" }
# Rust bindings for the VST3 interfaces. They need no SDK at build time.
vst3 = "0.3.0"
libloading = "0.8"
# The scan cache file and the answer of a scan process.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"

[dev-dependencies]
cpal = "=0.18.2"
# The host tests run plugin copies on the plugin workers of a test pool.
rustel-audio = { path = "../audio", features = ["test-support"] }
rustel-vst3-fixture = { path = "../vst3-fixture" }

# The live probe reads the policy of the audio thread.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# The main-thread scenario spawns this test as its own child processes,
# which need their real main thread to serve the plugin steps; a harness
# would run its own code there, so the target has none.
[[test]]
name = "main_thread"
path = "tests/main_thread.rs"
harness = false
